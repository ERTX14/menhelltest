<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOIR — Owner Panel</title><link rel="stylesheet" href="admin.css"></head><body><header><a href="index.html" class="brand"><b>N</b> NOIR</a><span>OWNER PANEL / 01</span><button id="reset">Сбросить демо</button></header><main><section class="admin-intro"><p>NOIR / CONTROL ROOM</p><h1>Управляй<br><i>своим сайтом.</i></h1><span>Цены, тексты и заявки редактируются здесь. Изменения сохраняются в браузере и сразу видны на сайте.</span></section><div class="tabs"><button class="tab active" data-tab="content">Контент</button><button class="tab" data-tab="services">Услуги</button><button class="tab" data-tab="bookings">Заявки <b id="badge"></b></button></div><section id="content" class="panel active"><div class="panel-title"><h2>Контент</h2><button class="save" id="saveContent">Сохранить</button></div><div class="form-grid"><label>Название<input id="brand"></label><label>Логотип <small>PNG / JPG / SVG до ~1 MB</small><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><span class="logo-preview" id="logoPreview"></span><button type="button" class="remove-logo" id="removeLogo">Убрать логотип</button></label><label>Телефон<input id="phone"></label><label>Адрес<input id="address"></label><label>Hero-текст<textarea id="heroText"></textarea></label><label>Текст пространства<textarea id="spaceText"></textarea></label><label>Текст в подвале<textarea id="footerText"></textarea></label></div></section><section id="services" class="panel"><div class="panel-title"><h2>Услуги и цены</h2><button class="save" id="addService">+ Добавить</button></div><div id="serviceEditor"></div></section><section id="bookings" class="panel"><div class="panel-title"><h2>Входящие заявки</h2><button class="save" id="clearBookings">Очистить</button></div><div id="bookingList"></div></section></main><div class="toast" id="toast"></div><script src="admin.js"></script></body></html>
